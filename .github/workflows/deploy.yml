name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC (early morning in Austin)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh city + OSM data (scheduled/manual runs only)
        if: github.event_name != 'push'
        run: |
          python3 pipeline/fetch_layers.py
          python3 pipeline/build_segments.py

      - name: Validate data
        run: python3 pipeline/validate.py

      - name: Rule-engine tests
        run: node --test tests/engine.test.mjs

      - name: Pipeline tests
        run: python3 -m unittest discover -s tests

      - name: Commit refreshed data if changed
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- public/data; then
            echo "No data changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data
            git commit -m "Weekly data refresh"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
